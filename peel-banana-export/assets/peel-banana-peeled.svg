<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 64" width="20" height="64">
  <!-- PLACEHOLDER ICON — Peel Banana mini-game, fully-peeled state. Same
       tapered-body silhouette and canvas as peel-banana-whole.svg (just a
       pale flesh color) so the reveal lines up seamlessly. Rendered 3
       times in-game, one per vertical third, each with its own CSS sepia
