       — see BROWN_MIN/MAX and buildBrownFilter() in js/minigames/peel.js. -->
  <g fill="none" stroke="#4A4038" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="7" y="0" width="6" height="8" rx="3" fill="#8B6F47"/>
    <path d="M2 20 C2 12 5 6 10 6 C15 6 18 12 18 20 L18 44 C18 52 15 58 10 58 C5 58 2 52 2 44 Z" fill="#F6EFD8"/>
  </g>
</svg>
